name: Publish to CurseForge

# Uploads the bundled jars of one GitHub release to CurseForge (and optionally Modrinth if configured in
# .github/publish.json). The files are downloaded from the release, so the store gets exactly what GitHub has.
# Runs after "Publish Release", or by hand (Actions -> Publish to CurseForge -> Run workflow) for an existing tag.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0'
        type: string
        required: true
      stores:
        description: 'Where to upload'
        type: choice
        options: [curseforge, both, modrinth]
        default: curseforge

permissions:
  contents: read

jobs:
  config:
    name: Check settings
    runs-on: ubuntu-latest
    outputs:
      modrinth: ${{ steps.ids.outputs.modrinth }}
      curseforge: ${{ steps.ids.outputs.curseforge }}
      channel: ${{ steps.ids.outputs.channel }}
      entries: ${{ steps.list.outputs.entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read project ids and tokens
        id: ids
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          STORES: ${{ inputs.stores || 'both' }}
        run: |
          modrinth=$(jq -r '.modrinth // ""' .github/publish.json)
          curseforge=$(jq -r '.curseforge // ""' .github/publish.json)
          case "${STORES}" in
            modrinth) curseforge="" ;;
            curseforge) modrinth="" ;;
          esac
          if [ -n "${modrinth}" ] && [ -z "${MODRINTH_TOKEN}" ]; then
            echo "::warning::Modrinth skipped: MODRINTH_TOKEN secret is not set"
            modrinth=""
          fi
          if [ -z "${curseforge}" ] || [ -z "${CURSEFORGE_TOKEN}" ]; then
            if [ "${STORES}" != "modrinth" ]; then
              echo "::warning::CurseForge skipped: set \"curseforge\" in .github/publish.json and the CURSEFORGE_TOKEN secret"
            fi
            curseforge=""
          fi
          echo "modrinth=${modrinth}" >> "$GITHUB_OUTPUT"
          echo "curseforge=${curseforge}" >> "$GITHUB_OUTPUT"
          echo "channel=$(jq -r '.channel // "release"' .github/publish.json)" >> "$GITHUB_OUTPUT"

      - name: List store uploads
        id: list
        run: |
          echo "entries=$(python3 .github/scripts/bundle.py entries)" >> "$GITHUB_OUTPUT"

  publish:
    name: Upload ${{ matrix.loader }} ${{ matrix.label }}
    needs: config
    if: needs.config.outputs.modrinth != '' || needs.config.outputs.curseforge != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.config.outputs.entries) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release jar and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "${TAG}" --pattern "${{ matrix.file }}" --dir dist
          bash .github/scripts/release-notes.sh "${TAG}" > dist/notes.md

      - name: Mark the jar for its loader
        if: matrix.marker
        run: |
          python3 -c '
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "a") as jar:
              jar.writestr("META-INF/mounthud-store-upload.txt", sys.argv[2] + "\n")
          ' "dist/${{ matrix.file }}" "${{ matrix.loader }}"

      - name: Prepare upload metadata
        id: prep
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          loader="${{ matrix.loader }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "number=${version}+mc${{ matrix.label }}-${loader}" >> "$GITHUB_OUTPUT"
          echo "file=dist/${{ matrix.file }}" >> "$GITHUB_OUTPUT"
          echo "loaders=${{ matrix.loaders }}" >> "$GITHUB_OUTPUT"
          echo "name=${loader^}" | sed 's/Neoforge/NeoForge/' >> "$GITHUB_OUTPUT"
          echo "range=${{ matrix.label }}" | sed 's/-/–/' >> "$GITHUB_OUTPUT"
          {
            echo 'game_versions<<EOF'
            tr ' ' '\n' <<< "${{ matrix.versions }}"
            echo 'EOF'
            echo 'dependencies<<EOF'
            if [ "${loader}" = "fabric" ]; then printf 'modmenu(optional)\n'; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload to store
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ needs.config.outputs.modrinth }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ needs.config.outputs.curseforge }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.prep.outputs.file }}
          name: Mount HUD ${{ steps.prep.outputs.version }} (${{ steps.prep.outputs.name }} ${{ steps.prep.outputs.range }})
          version: ${{ steps.prep.outputs.number }}
          version-type: ${{ needs.config.outputs.channel }}
          changelog-file: dist/notes.md
          loaders: ${{ steps.prep.outputs.loaders }}
          game-versions: ${{ steps.prep.outputs.game_versions }}
          dependencies: ${{ steps.prep.outputs.dependencies }}
          environment: client
