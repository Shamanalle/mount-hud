name: Publish Release

# Publishes the release for mod_version from gradle.properties: builds every jar, packs them into the universal
# jars of versions/bundles.txt, takes the notes from CHANGELOG.md and attaches the bundled jars. Starts either
# from a pushed tag (vX.Y.Z) or by hand (Actions -> Publish Release -> Run workflow on main), in which case the
# tag is created too. Then the files go to Modrinth and CurseForge through publish.yml.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_ingame:
        description: 'Skip the in-game tests (when the same commit already passed them on its pull request)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingame:
    name: In-game tests
    if: ${{ !inputs.skip_ingame }}
    uses: ./.github/workflows/ingame.yml

  unit:
    name: Unit tests
    needs: ingame
    if: ${{ !cancelled() && (needs.ingame.result == 'success' || needs.ingame.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Resolve the release tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${tag}" != "${GITHUB_REF_NAME}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match mod_version ${version}"
              exit 1
            fi
          else
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Run the release from main, not ${GITHUB_REF_NAME}"
              exit 1
            fi
            if gh release view "${tag}" > /dev/null 2>&1; then
              echo "::error::Release ${tag} already exists; raise mod_version first"
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          channel=$(jq -r '.channel // "release"' .github/publish.json)
          if [ "${channel}" = "release" ]; then
            echo "name=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${tag} (${channel})" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests
        run: |
          chmod +x gradlew
          bash .github/scripts/net-retry.sh -- ./gradlew :common:test --no-daemon
      - name: Minecraft versions to build
        id: versions
        run: |
          versions=$(ls versions/*.properties | xargs -n1 basename | sed 's/\.properties$//' | sort -V | jq -R . | jq -cs .)
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.mc }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        mc: ${{ fromJSON(needs.unit.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          bash .github/scripts/net-retry.sh -- ./gradlew build -x :common:test -Pminecraft_version=${{ matrix.mc }} --no-daemon
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: [unit, build]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.unit.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          merge-multiple: true
          path: dist
      - name: Check shared jars and build bundles
        run: |
          python3 .github/scripts/release_groups.py check dist release-jars
          python3 .github/scripts/bundle.py release-jars bundled-jars
          ls -la bundled-jars/
      - name: Release notes from CHANGELOG.md
        run: bash .github/scripts/release-notes.sh "${{ needs.unit.outputs.tag }}" > release_body.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.unit.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.unit.outputs.name }}
          files: bundled-jars/*.jar
          body_path: release_body.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stores:
    name: Modrinth & CurseForge
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
