# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# JDKs Gradle may compile or run the game with (Java 17 for Forge 1.20.1, 21 for 1.20.5 - 1.21.11, 25 for 26.x),
# found on GitHub's runners through these variables or downloaded
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64
# Set up only the modules a task needs (':common:test' does not wait for Minecraft)
org.gradle.configureondemand=true

# Mod
mod_version=0.1.0
maven_group=com.kasper.mounthud
mod_id=mounthud
mod_name=Mount HUD

# Minecraft version this build is for; its loaders and dependencies are in versions/<minecraft_version>.properties.
# Build another one with -Pminecraft_version=<version> (CI builds every file in versions/).
minecraft_version=1.21.1

# Fabric Loader used in the dev client and test client; the jar asks for loader_min or newer
fabric_loader_version=0.19.5
loader_min=0.15.0
