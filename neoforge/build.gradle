// The NeoForge jar of one Minecraft version (1.20.5 and newer, which run with Mojang's names: nothing is remapped).
apply plugin: 'net.neoforged.moddev'
apply from: "${rootDir}/gradle/sources.gradle"

if (rootProject.minecraft_version == '1.20.5') {
    dependencies.components {
        withModule('net.neoforged:neoforge',
                Class.forName('net.neoforged.moddevgradle.legacyforge.internal.LegacyForgeMetadataTransform'))
        withModule('net.neoforged:neoforge') {
            withVariant('modDevBundle') {
                withDependencies { deps ->
                    deps.removeAll { it.name in ['mcp_config', 'minecraft-dependencies'] }
                    deps.add('net.neoforged:neoform:1.20.5-20241215.200814')
                }
            }
            ['modDevApiElements', 'modDevRuntimeElements'].each { variant ->
                withVariant(variant) {
                    withDependencies { deps ->
                        deps.removeAll { it.name in ['mcp_config', 'minecraft-dependencies'] }
                        deps.add('net.neoforged:minecraft-dependencies:1.20.5')
                    }
                }
            }
            withVariant('sources') {
                withDependencies { deps ->
                    deps.clear()
                }
            }
        }
    }
}

neoForge {
    version = rootProject.neoforge_version
    runs {
        client {
            client()
        }
    }
    mods {
        mounthud {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def versions = released.versions
    def props = [version: project.version,
                 minecraft_range: versions.size() == 1 ? "[${versions[0]}]" : "[${versions.first()},${versions.last()}]"]
    inputs.properties props
    def packMetadata = rootProject.packMetadata(versions)
    inputs.property 'pack_metadata', packMetadata
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
    doLast {
        new File(destinationDir, 'pack.mcmeta').text = packMetadata
    }
}
