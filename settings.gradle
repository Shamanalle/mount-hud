pluginManagement {
    repositories {
        maven { url = uri("https://maven.fabricmc.net/") }
        maven { url = uri("https://maven.neoforged.net/releases/") }
        maven { url = uri("https://maven.minecraftforge.net/") }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // JDKs the modules ask for (toolchains), found on the machine or downloaded
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mount-hud'

// The pure logic (no Minecraft classes), compiled into every jar and unit-tested
include 'common'

// One build is for one Minecraft version (minecraft_version in gradle.properties or -Pminecraft_version=...).
// versions/<minecraft_version>.properties names the loaders built for it: each is a module (fabric, forge,
// neoforge) with the shared Minecraft code of mc/ compiled in.
def minecraftVersion = providers.gradleProperty('minecraft_version').get()
def versionFile = file("versions/${minecraftVersion}.properties")
if (!versionFile.exists()) {
    throw new GradleException("Minecraft ${minecraftVersion} is not supported: ${versionFile} is missing")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
versionProps.getProperty('loaders').split(',')*.trim().findAll { it }.each { loader ->
    if (!(loader in ['fabric', 'forge', 'neoforge'])) {
        throw new GradleException("${versionFile.name}: unknown loader ${loader}")
    }
    include loader
}
